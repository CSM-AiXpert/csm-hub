  <rect width="69.282" height="120" fill="#000"/>
  <use href="#h" xlink:href="#h" x="0" y="0"/>
  <use href="#h" xlink:href="#h" x="69.282" y="0"/>
  <use href="#h" xlink:href="#h" x="34.641" y="60"/>

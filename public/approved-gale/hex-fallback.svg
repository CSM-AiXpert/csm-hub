      <polygon points="0,-33 28.58,-16.5 28.58,16.5 0,33 -28.58,16.5 -28.58,-16.5" fill="#030304"/>
      <polygon points="0,-30.5 26.41,-15.25 26.41,15.25 0,30.5 -26.41,15.25 -26.41,-15.25" fill="url(#face)"/>
      <polygon points="0,-30.5 26.41,-15.25 26.41,15.25 0,30.5 -26.41,15.25 -26.41,-15.25" fill="none"/>
      <polyline points="-26.41,-15.25 0,-30.5 26.41,-15.25" fill="none" stroke="#a9b6ff" stroke-opacity=".28" stroke-width=".8"/>
    </g>
